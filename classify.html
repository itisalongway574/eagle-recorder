<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>存到 Eagle</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f3f3f5;
    --border: #dcdce0;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2023;
      --surface: #2a2b2f;
      --border: #3a3b40;
      --text: #ececee;
      --muted: #9a9aa1;
      --accent: #3d7bff;
      --accent-text: #ffffff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "PingFang TC", sans-serif;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    min-height: 0;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .top { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
  .media { display: flex; flex-direction: column; gap: 6px; }
  video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 8px;
    object-fit: contain;
  }
  .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }

  input, select {
    width: 100%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .tag-box {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
  }
  .tag-box:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tag-box input { flex: 1; min-width: 160px; border: 0; padding: 4px; background: transparent; outline: none; }

  .section-title { font-size: 12px; color: var(--muted); margin-bottom: -4px; }
  .tag-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip.new { border-style: dashed; }
  .chip .x { margin-left: 4px; opacity: .8; }
  .empty { color: var(--muted); font-size: 13px; }
  #error { color: #e5484d; font-size: 13px; }
  #error:empty { display: none; }

  footer {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .hint { font-size: 12px; color: var(--muted); }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 6px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary:disabled { opacity: .6; cursor: default; }

  @media (max-width: 640px) {
    .top { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main>
    <section class="top">
      <div class="media">
        <video id="preview" controls muted autoplay loop playsinline></video>
        <div class="meta" id="meta"></div>
      </div>
      <div class="fields">
        <label>名稱<input id="name"></label>
        <label>網址<input id="url"></label>
        <label>資料夾<select id="folder"><option value="">（不指定資料夾）</option></select></label>
      </div>
    </section>

    <div class="tag-box">
      <span class="chips" id="selected"></span>
      <input id="tagInput" placeholder="搜尋或新增標籤…" autocomplete="off">
    </div>

    <div class="section-title" id="listTitle">最近使用的標籤</div>
    <div class="tag-scroll"><div class="chips" id="tagList"></div></div>
    <div id="error"></div>
  </main>
  <footer>
    <span class="hint">Enter 新增標籤・⌘/Ctrl+Enter 儲存・直接關閉視窗會用預設值儲存</span>
    <button class="primary" id="save" type="button">存到 Eagle ⌘↵</button>
  </footer>
  <script src="classify.js"></script>
</body>
</html>
