<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Eagle Tab Recorder 設定</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
  body { margin: 16px; min-width: 320px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  select { width: 100%; padding: 6px; font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  #status { opacity: .7; }
</style>
</head>
<body>
  <label for="folder">預設存入的 Eagle 資料夾</label>
  <select id="folder"><option value="">（不指定，存到未分類）</option></select>
  <div class="row">
    <button id="reload" type="button">重新讀取資料夾</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
